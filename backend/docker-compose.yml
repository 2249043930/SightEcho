version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: sightecho-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: sightecho
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sightecho-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: sightecho-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: .
    container_name: sightecho-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_BASE: http://127.0.0.1:9000
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: ["./entrypoint.sh"]

  celery_worker:
    build: .
    container_name: sightecho-celery
    restart: unless-stopped
    depends_on:
      - backend
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ./:/app
    command: celery -A app.tasks.celery_app worker -l info -c 4

  celery_beat:
    build: .
    container_name: sightecho-celery-beat
    restart: unless-stopped
    depends_on:
      - backend
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
    volumes:
      - ./:/app
    command: celery -A app.tasks.celery_app beat -l info

volumes:
  mysql_data:
  minio_data:
